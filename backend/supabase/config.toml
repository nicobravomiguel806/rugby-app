# Configuración del entorno local de Supabase (supabase start). Los proyectos dev y prod se enlazan con `supabase link`.
project_id = "rugby-app"

[api]
enabled = true
port = 54321
schemas = ["public"]
max_rows = 500

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "rugbyapp://auth-callback"
# C-01 · ADR 0008: el enlace de verificación vuelve a la app por este esquema (PKCE). Exacta, sin comodines (AT-19).
# En Supabase dev la misma URL va en Authentication → URL Configuration → Redirect URLs.
additional_redirect_urls = ["rugbyapp://auth-callback"]
enable_signup = true
minimum_password_length = 10

[auth.email]
enable_signup = true
enable_confirmations = true

# SP-04 · ADR 0006: inicio nativo con Google (signInWithIdToken). Solo para `supabase start` local; dev en la nube ya lo
# configuró el PO. Necesita estas variables de entorno (el secreto nunca entra al repo):
#   SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID = client ids separados por comas: Web primero, luego iOS y Android
#   SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET    = secreto del cliente Web
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
# P-9: nonce obligatorio. Supabase compara SHA-256(nonce crudo) con el claim `nonce` del ID token.
skip_nonce_check = false

[auth.rate_limit]
sign_in_sign_ups = 30
token_refresh = 150

[realtime]
enabled = true
