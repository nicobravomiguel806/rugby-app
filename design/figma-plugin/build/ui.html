<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { font: 13px/1.45 Inter, system-ui, sans-serif; margin: 0; padding: 14px; color: #14171A; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  #log { background: #F5F3EE; border-radius: 8px; padding: 8px 10px; height: 150px; overflow: auto; white-space: pre-wrap; }
  #out { display: none; margin-top: 10px; }
  textarea { width: 100%; height: 120px; font: 11px/1.4 ui-monospace, Menlo, monospace; box-sizing: border-box; }
  button { margin-top: 6px; background: #0F4D32; color: #fff; border: 0; border-radius: 8px; padding: 8px 12px; font-weight: 600; cursor: pointer; }
  .err { color: #D7263D; }
</style></head>
<body>
  <h1>Rugby App · Constructor de flujos</h1>
  <div id="log">Iniciando…</div>
  <div id="out">
    <p><b>Listo.</b> Copia estos enlaces y pégalos en el chat con Claude para ligar cada historia de Notion con su columna en Figma.</p>
    <textarea id="links" readonly></textarea>
    <button id="copy">Copiar enlaces</button>
  </div>
<script>
  const log = document.getElementById("log");
  onmessage = (ev) => {
    const m = ev.data.pluginMessage; if (!m) return;
    if (m.type === "log") { log.textContent += "\n" + m.msg; log.scrollTop = log.scrollHeight; }
    if (m.type === "error") { log.innerHTML += '\n<span class="err">Error: ' + m.msg.replace(/</g, "&lt;") + "</span>"; }
    if (m.type === "done") { document.getElementById("out").style.display = "block"; document.getElementById("links").value = m.links; }
  };
  document.getElementById("copy").onclick = () => { const t = document.getElementById("links"); t.select(); document.execCommand("copy"); };
</script>
</body></html>
