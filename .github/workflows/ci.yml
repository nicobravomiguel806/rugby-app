name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      ios: ${{ steps.f.outputs.ios }}
      android: ${{ steps.f.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend: ['backend/**']
            ios: ['ios/**']
            android: ['android/**']

  pr-convention:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: El título del PR lleva el ID de la historia
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|spike|test|docs|chore|refactor)\(((AN-)?[A-Z]-[0-9]{2}|SP-[0-9]{2})\)' \
            || { echo "::error::Usa 'tipo(ID): descripción', p. ej. 'feat(V-02): registrar ensayo'"; exit 1; }

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # Se usa el binario directo: la acción oficial falla en la primera subida de una rama
      # (intenta revisar "<primer commit>^", que no existe). Así se escanea siempre toda la historia.
      - name: gitleaks (historia completa)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz -C /tmp gitleaks
          /tmp/gitleaks git --redact -v --exit-code 1 .

  architecture-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Domain no importa frameworks (CP-001 / CP-100)
        run: ./scripts/architecture-guard.sh

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migraciones + pruebas de RLS y sincronización (CP-140 a CP-150)
        run: ./backend/scripts/run-db-tests.sh

  ios-domain:
    needs: changes
    if: needs.changes.outputs.ios == 'true' || github.event_name == 'push'
    # SP-04 · H-2: macos-14 se retiró el 2 nov 2026; mismo runner y Xcode que ios-app.
    # SP-04 · H-18 (plan B, decisión del PO 2026-11-06): macos-15 + Xcode 16.4 por falta de capacidad de macos-26.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Tests de dominio iOS (CP-120 a CP-135)
        working-directory: ios/Packages/Domain
        run: swift test --enable-code-coverage

  android-domain:
    needs: changes
    if: needs.changes.outputs.android == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests de dominio Android (CP-120 a CP-135)
        working-directory: android
        run: ./gradlew :domain:test --console=plain

  # T-03 · compila la app de iOS y corre las pruebas alojadas, de Presentation y de UI en el simulador.
  # SP-04 · H-2 (decisión del PO, ADR 0004): deployment target iOS 17.0 y CP-111 en un simulador con runtime
  # iOS 17. Las dependencias salen solo de los Package.resolved versionados.
  # SP-04 · H-18 (plan B, decisión del PO 2026-11-06): macos-15 + Xcode 16.4 por falta de capacidad de macos-26.
  # macos-15 no trae runtime iOS 17: simulador-ios17.sh lo descarga y, si no puede, el paso falla.
  # No es requerido todavía: el PO lo agrega a la protección de main después de la primera corrida (P-7).
  ios-app:
    needs: changes
    if: needs.changes.outputs.ios == 'true' || github.event_name == 'push'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: XcodeGen (ADR 0004)
        run: brew install xcodegen
      - name: Simulador con runtime iOS 17 (CP-111)
        run: |
          DESTINO="$(./ios/scripts/simulador-ios17.sh)"
          echo "IOS_DESTINATION=$DESTINO" >> "$GITHUB_ENV"
      - name: Build + pruebas en simulador (CA-2 / CP-111)
        run: ./ios/scripts/build-app.sh

  # AN-T-03 · compila la app de Android y corre la prueba instrumentada en un emulador con API 29 (CA-7 / CP-111).
  # No es requerido todavía: el PO lo agrega a la protección de main después de la primera corrida (P-7).
  android-app:
    needs: changes
    if: needs.changes.outputs.android == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      # H-11: sin android-actions/setup-android; ubuntu-latest ya trae el SDK en ANDROID_HOME.
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests unitarios + assembleDebug
        run: ./android/scripts/build-app.sh
      - name: Habilitar KVM para el emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prueba instrumentada en emulador API 29 (Android 10)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          working-directory: ./android
          script: ./gradlew :app:connectedDebugAndroidTest --console=plain
